[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stress_signals"
version = "0.0.1"
description = "Aggregate, population-level stress-related language signals (no diagnosis, no individual-level outputs)."
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["stress_signals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
